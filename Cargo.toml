[package]
name = "vaam-image-webp"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80.1"

description = "Pure-Rust WebP codec - the only published crate with a lossy (VP8) encoder in pure Rust"
homepage = "https://github.com/vaam-apps/vaam-image-webp"
repository = "https://github.com/vaam-apps/vaam-image-webp"
categories = ["multimedia::images", "multimedia::encoding", "encoding"]

include = ["/src", "LICENSE-APACHE", "LICENSE-MIT", "README.md"]

# The *package* is renamed (vaam-image-webp) but the Rust *lib target* keeps
# upstream's `image_webp` name so this crate is a drop-in replacement:
# swapping the `image-webp` dependency for `vaam-image-webp` needs no source
# changes, since `use image_webp::...` keeps resolving. Downstreams write
# `vaam-image-webp = "..."` and `use image_webp::...`.
[lib]
name = "image_webp"
path = "src/lib.rs"

[dependencies]
byteorder-lite = "0.1.0"
quick-error = "2.0.1"

[dev-dependencies]
# `webp` (libwebp) and `dssim-core` back examples/rd_eval.rs, which measures
# this crate's lossy encoder against libwebp at matched perceptual quality.
# `ssimulacra2` backs examples/ssimu2_eval.rs, which reports bytes and
# SSIMULACRA2 at fixed quality - see that example's doc comment for why a
# perceptual metric, not just DSSIM, is what decides whether a change like
# adaptive quantisation actually helped. Dev-only: none of `webp`,
# `dssim-core` or `ssimulacra2` are linked into the library, so downstreams
# that depend on this crate to avoid C do not get libwebp through it.
dssim-core = "3.5"
rgb = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
paste = "1.0.14"
png = "0.17.12"
rand = "0.8.5"
webp = "0.3.0"
ssimulacra2 = "0.5"

[features]
_benchmarks = []
